name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Build
        run: go build ./...

      - name: Run unit tests
        run: go test ./...  # Excludes integration due to build tags

      - name: Run unit tests with coverage
        run: |
          PKGS=$(go list ./... | grep -v /tests/ | tr '\n' ',')
          go test -coverpkg="$PKGS" -coverprofile=unit.out ./...
          go tool cover -func=unit.out
          go tool cover -html=unit.out -o unit_coverage.html

      - name: Upload unit coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: |
            unit.out
            unit_coverage.html

  integration-tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: inventory_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Wait for MySQL
        run: |
          # Ensure mysql client is available on the runner
          sudo apt-get update || true
          sudo apt-get install -y default-mysql-client || sudo apt-get install -y mysql-client || true

          # Wait for MySQL to become available with a timeout to avoid hanging the job
          TIMEOUT=${{ env.MYSQL_STARTUP_TIMEOUT || 60 }}
          INTERVAL=${{ env.MYSQL_POLL_INTERVAL || 2 }}
          DEADLINE=$((SECONDS+TIMEOUT))
          until mysqladmin ping -h 127.0.0.1 -P 3306 --silent; do
            if [ $SECONDS -ge $DEADLINE ]; then
              echo "Timed out waiting for MySQL after ${TIMEOUT}s"
              exit 1
            fi
            echo "Waiting for MySQL..."
            sleep $INTERVAL
          done

      - name: Run integration tests with coverage
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: "3306"
          TEST_DB_USER: root
          TEST_DB_PASSWORD: root
          TEST_DB_DSN: root:root@tcp(127.0.0.1:3306)/inventory_test?charset=utf8mb4&parseTime=True&loc=Local
        run: |
          PKGS=$(go list ./... | grep -v /tests/ | tr '\n' ',')
          go test -tags integration -coverpkg="$PKGS" -coverprofile=integration.out ./...
          go tool cover -func=integration.out
          go tool cover -html=integration.out -o integration_coverage.html

      - name: Upload integration coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: integration-coverage
          path: |
            integration.out
            integration_coverage.html

  e2e-tests:
    runs-on: ubuntu-latest
    services:
      db-test:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: inventory_test
        options: >-
          --health-cmd="mysqladmin ping --silent" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      - name: Instalar Docker Compose
        run: sudo apt-get update && sudo apt-get install -y docker-compose
      - name: Subir dependências de teste
        run: docker-compose up -d db-test
        # O acesso ao banco deve ser feito via host 'db-test' e porta interna 3306
      - name: Aguardar dependências
        run: |
          until docker-compose exec db-test mysqladmin ping -h"db-test" --silent; do sleep 2; done
          until curl -s http://localhost:9002/minio/health/live; do sleep 2; done
      - name: Subir MinIO para E2E
        run: |
          docker run -d --name minio-test -p 9002:9000 -p 9003:9001 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data --console-address :9001
      - name: Aguardar MinIO
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:9002/minio/health/live; then exit 0; fi
            sleep 2
          done
          echo "MinIO não respondeu a tempo" && exit 1
      - name: Rodar testes E2E
        run: make test-e2e
