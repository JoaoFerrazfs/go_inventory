definitions:
  domain.PalletEntity:
    properties:
      id:
        type: integer
      name:
        type: string
      palletRackId:
        type: integer
      palletizedProduct:
        items:
          $ref: '#/definitions/domain.PalletizedProductEntity'
        type: array
      qr_code:
        type: string
      qr_code_url:
        type: string
    required:
    - name
    - palletRackId
    type: object
  domain.PalletRackEntity:
    properties:
      id:
        type: integer
      location:
        type: string
      name:
        type: string
      pallets:
        items:
          $ref: '#/definitions/domain.PalletEntity'
        type: array
      total_capacity:
        type: integer
    required:
    - location
    - name
    - total_capacity
    type: object
  domain.PalletizedProductEntity:
    properties:
      ean:
        type: integer
      id:
        type: integer
      palletID:
        type: integer
      quantity:
        type: integer
    required:
    - ean
    - quantity
    type: object
  requests.PalletRackRequest:
    properties:
      location:
        type: string
      name:
        type: string
      totalCapacity:
        minimum: 1
        type: integer
    required:
    - location
    - name
    - totalCapacity
    type: object
  requests.PalletRequest:
    properties:
      name:
        type: string
      palletRackId:
        type: integer
    required:
    - name
    - palletRackId
    type: object
  requests.PalletizedProductRequest:
    properties:
      ean:
        type: integer
      quantity:
        type: integer
    required:
    - ean
    - quantity
    type: object
host: localhost:3000
info:
  contact:
    email: joaoferrazp@gmail.com
    name: API Support
  description: It is system to manage pallets and related products.
  title: Go Inventory API
  version: "1.0"
paths:
  /api/v1/pallet/products/{palletId}:
    patch:
      consumes:
      - application/json
      parameters:
      - description: ID do pallet
        in: path
        name: palletId
        required: true
        type: integer
      - description: Palletized Product
        in: body
        name: pallet
        required: true
        schema:
          $ref: '#/definitions/requests.PalletizedProductRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.PalletizedProductEntity'
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Add a product to a pallet
      tags:
      - Palletized products
  /api/v1/pallet/products/{palletId}/{productsEan}:
    delete:
      consumes:
      - application/json
      parameters:
      - description: ID do pallet
        in: path
        name: palletId
        required: true
        type: integer
      - description: EAN do produto
        in: path
        name: productsEan
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete product from pallet
      tags:
      - Palletized products
