name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Build
        run: go build ./...

      - name: Run tests
        run: go test ./...

      - name: Run tests with coverage (including main code)
        run: |
          go list ./SupplyInventory/... ./Helpers/... ./Container/... ./main.go | tr '\n' ',' | sed 's/,$//' > pkgs.txt
          PKGS=$(cat pkgs.txt)
          go test -coverpkg=$PKGS -coverprofile=coverage.out ./tests/...

      - name: Show coverage summary
        run: |
          go tool cover -func=coverage.out
          total_cov=$(go tool cover -func=coverage.out | grep total | awk '{print substr($3, 1, length($3)-1)}')
          echo "Total coverage: $total_cov%"
          cov_num=${total_cov%.*}
          if [ "$cov_num" -lt 80 ]; then
            echo "::warning ::Test coverage is below 80% ($total_cov%)"
          fi
