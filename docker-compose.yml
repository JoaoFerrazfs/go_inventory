services:
  test-e2e:
    image: golang:1.24
    working_dir: /app
    volumes:
      - ./:/app
      - go_mod_cache:/go/pkg/mod
    environment:
      - ENV_FILE=.env.test
    depends_on:
      - db-test
      - minio-test
    command: go test -tags=integration -v ./SupplyInventory/tests/e2e
  app:
    container_name: go_inventory_dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    working_dir: /app
    volumes:
      - .:/app
    command: air -c .air.toml
    environment:
      - STORAGE_PROVIDER=minio
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=inventory
      - MINIO_REGION=us-east-1
      - MINIO_USE_SSL=false
      - MINIO_PUBLIC_ENDPOINT=http://localhost:9000
      - MINIO_PUBLIC_READ=true
      - TEST_DB_HOST=db
      - TEST_DB_PORT=3306
      - TEST_DB_USER=root
      - TEST_DB_PASSWORD=root
    depends_on:
      - db

  db:
    image: mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: inventory
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  db-test:
    image: mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: inventory_test
    ports:
      - "3307:3306"
    volumes:
      - db_test_data:/var/lib/mysql

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  minio-test:
    image: minio/minio:latest
    ports:
      - "9002:9000"
      - "9003:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_test_data:/data

volumes:
  db_data:
  minio_data:
  db_test_data:
  minio_test_data:
  go_mod_cache:
