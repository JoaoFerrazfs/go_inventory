            items:
              $ref: '#/definitions/domain.PalletEntity'
            type: array
        "404":
          description: Not Found
      summary: List pallets
      tags:
      - Pallets
    post:
      consumes:
      - application/json
      parameters:
      - description: Palletized Product
        in: body
        name: pallet
        required: true
        schema:
          $ref: '#/definitions/requests.PalletRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
